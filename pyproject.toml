# === build system requirements
[build-system]
build-backend = 'setuptools.build_meta'
requires = ['setuptools>=65.5.0', 'wheel']


# === standard project description options
[project]
authors = [{name = 'Stefano Ubbiali', email = 'subbiali@phys.ethz.ch'}]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Science/Research',
    'Operating System :: POSIX',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Scientific/Engineering :: Atmospheric Science',
]
dependencies = [
    'gt4py>=1.0.4',
    'numpy>=1.22',
    'pydantic<2.0',
    'sympl @ git+https://github.com/stubbiali/sympl.git@oop'
]
description = 'Infrastructure code and convenient utilities to implement IFS physical parameterizations in Python.'
dynamic = ['version']
keywords = [
    'framework',
    'physical parameterizations',
]
license = 'Apache-2.0'
license-files = ['LICENSE.md']
name = 'ifs_physics_common'
readme = {file = 'README.md', content-type = 'text/markdown'}
requires-python = '>=3.10,<3.15'  # note(stubbiali): same as pmap

[project.optional-dependencies]
dev = [
    'ipdb',
    'ipython',
    'mypy',
    'pre-commit',
    'ruff==0.14.13',  # note(stubbiali): same as pmap
]
gpu = [
    # note(stubbiali): minimum version providing support for ROCm 6.4
    'cupy>=13.5.0'
]
gpu-cuda11x = ['cupy-cuda11x']
gpu-cuda12x = ['cupy-cuda12x']

[project.urls]
Source = 'https://github.com/stubbiali/ifs_physics_common.git'


# === tool: ruff
[tool.ruff]
line-length = 100
output-format = 'grouped'
respect-gitignore = true
show-fixes = true
src = ['src']
target-version = 'py310'  # the oldest supported python version

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
preview = true
# note: the full list of available rule sets can be found at https://docs.astral.sh/ruff/rules/
# todo(stubbiali): enable CPY rule once copyright headers are added
# todo(stubbiali): should we enable ERA (commented-out code) and C90 (mccabe) rules?
select = [
    'A',  # flake8-builtins
    'B',  # flake8-bugbear
    'C4',  # flake8-comprehensions
    'E',  # pycodestyle - Error
    'F',  # pyflakes
    'FA',  # flake8-future-annotations
    'I',  # isort
    'ICN',  # flake8-import-conventions
    'ISC',  # flake8-implicit-str-concat
    'NPY',  # numpy-specific rules
    'PGH',  # pygrep-hooks
    'PL',  # pylint
    'PYI',  # flake8-pyi
    'Q',  # flake8-quotes
    'RUF',  # ruff-specific rules
    'T10',  # flake8-debugger
    'TC',  # flake8-type-checking
    'YTT'  # flake8-2020
]
# note(stubbiali): ignore specific rules that are too strict
ignore = [
    'B028',  # flake8-bugbear: no-explicit-stacklevel
    'B905',  # flake8-bugbear: zip-without-explicit-strict
    'PLR0904',  # pylint(refactor): too-many-public-methods
    'PLR0911',  # pylint(refactor): too-many-return-statements
    'PLR0912',  # pylint(refactor): too-many-branches
    'PLR0913',  # pylint(refactor): too-many-arguments
    'PLR0914',  # pylint(refactor): too-many-locals
    'PLR0915',  # pylint(refactor): too-many-statements
    'PLR0916',  # pylint(refactor): too-many-boolean-expressions
    'PLR0917',  # pylint(refactor): too-many-positional-arguments
    'PLR1702',  # pylint(refactor): too-many-nested-blocks
    'PLR2004',  # pylint(refactor): magic-value-comparison
    'PLR6201',  # pylint(refactor): literal-membership
    'PLW1514',  # pylint(warning): unspecified-encoding
    'RUF052',  # ruff-specific rules: used-dummy-variable
]

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ['ifs_physics_common']
section-order = [
    'future',
    'standard-library',
    'third-party',
    'third-party-dev',
    'first-party',
    'testing-third-party',
    'testing-first-party',
    'local-folder'
]
split-on-trailing-comma = false

[tool.ruff.lint.isort.sections]
third-party-dev = ['gt4py', 'sympl']
testing-first-party = ['tests']
testing-third-party = ['pytest']

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    'gt4py.eve.datamodels.root_validator',
    'gt4py.eve.datamodels.validator',
    'pydantic.validator'
]

[tool.ruff.lint.pydocstyle]
convention = 'google'


# === tool: mypy
[tool.mypy]
check_untyped_defs = true
# set to `true` once cupy and sympl support typing
disallow_any_unimported = false
disallow_incomplete_defs = true
disallow_untyped_defs = true
implicit_optional = false
install_types = true
plugins = 'numpy.typing.mypy_plugin'
show_column_numbers = true
show_error_codes = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = 'cupy'
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = 'sympl.*'
ignore_missing_imports = true


# === tool: setuptools
[tool.setuptools]
platforms = ['Linux', 'Mac']

[tool.setuptools.dynamic]
version = {attr = 'ifs_physics_common.__version__'}

[tool.setuptools.package-data]
'ifs_physics_common' = ['py.typed']

[tool.setuptools.packages]
find = {namespaces = false, where = ['src']}
